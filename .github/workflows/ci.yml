name: CI

# Gates the merge. Playwright joined this list with the home page, Vitest with the first
# pure logic in lib/, and the row-level security suite joins it with the Supabase schema
# at v0.3.0.
on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow reuse this exact gate before a production deploy,
  # so a release verifies the commit it ships rather than trusting main's HEAD.
  workflow_call:

# No workflow-level concurrency on purpose (#134). What has to be serialised is the hosted
# Supabase project, and only the `verify` job below touches it — `seed` builds and destroys a
# local stack of its own and has no reason to queue behind anything. The group is declared on
# that job instead, and the reasoning is written out there.

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # ---------------------------------------------------------------------------------------
    # ONE RUN AT A TIME AGAINST THE HOSTED DATABASE, AND NEVER CANCELLED (#134)
    # ---------------------------------------------------------------------------------------
    #
    # `test:db` and `test:e2e` both write to the fixture organization on the one hosted Supabase
    # project. #98 decided that one shared project is right — CI has no write-capable credential
    # to create a scratch one with — but nothing then treated the project as the contended
    # resource that decision makes it. This block is that.
    #
    # THE GROUP IS A CONSTANT, NOT `github.ref`. Per-ref grouping serialises a branch against
    # itself and nothing else, so two pull requests are two refs and used to run at the same
    # time, both inserting and deleting the same `rlsFixture*` rows. Nobody hit it only because
    # this project rarely has two branches in flight.
    #
    # `cancel-in-progress: false` IS THE OTHER HALF, and it is what the ticket was filed for.
    # Every suite cleans up in `afterAll`, and a cancelled job never reaches `afterAll` — so
    # cancelling a run mid-suite strands its fixture rows, and the *next* run fails on a row
    # count nowhere near whatever it was actually testing. That is the v0.7.0 dry run: starting
    # it put the release into the same per-ref group as the post-merge CI on `main`, cancelled
    # that run four seconds after it inserted `rlsFixtureTwin`, and then failed on the three
    # program rows the strand left behind. The release was fine. The gate shot itself.
    #
    # What this costs: pushing twice to a branch in quick succession now runs both gates instead
    # of superseding the first, and a queued run waits for whatever is ahead of it. Runner
    # minutes are free on a public repository; a red run that has nothing to do with the diff
    # costs an afternoon.
    #
    # One behaviour worth knowing before it surprises someone: when a run is already executing
    # and a second is already waiting, a third displaces the *waiting* one, which GitHub reports
    # as cancelled. That is safe — a job that never started has written nothing — but it means a
    # release gate can be displaced while it waits. It does not deploy on a cancelled gate, so
    # the outcome is a release to re-run rather than a bad one to roll back. Cut releases when
    # the queue is quiet; `docs/RUNBOOK.md` says so at the dry-run step.
    concurrency:
      group: hosted-database
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------------------------
      # CAN THIS GATE ACTUALLY RUN IN FULL? (#105)
      # ---------------------------------------------------------------------------------------
      #
      # First, before the install, because the thing it protects against is a run that looks
      # like the merge gate and is not one. `release.yml` reuses this workflow through
      # `workflow_call`, and a called workflow inherits repository *variables* by itself but
      # never *secrets* — so a release gate can silently run a weaker configuration than the
      # merge gate did. That is #103: four suites threw a missing-configuration error, the
      # deploy was skipped, and production stayed on v0.3.0 while v0.4.0 showed as released.
      #
      # Refusing here turns that into one annotated error in the first ten seconds that names
      # `secrets: inherit` as the fix, rather than a pile of database errors several minutes in
      # that read as though the database were broken. Node is preinstalled on the runner, so
      # this needs neither setup-node nor npm ci above it.
      #
      # `scripts/require-complete-gate.test.mjs` is the other half and runs on the merge gate:
      # it asserts this step still exists and that release.yml still inherits secrets.
      - name: The gate must be able to run in full
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: node scripts/require-complete-gate.mjs

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      # Unit tests before the build, because they need neither one and finish in under a
      # second. A broken rate calculation should fail the job in seconds rather than after
      # a full production build and a browser download.
      - run: npm run test:unit

      # The suites that need the real hosted project — mocking a database behaviour would
      # only ever prove the mock agrees with the assertions. Three of them:
      #
      #   - Row-level security, anonymous: drafts are invisible to the anonymous key, and the
      #     key cannot write to any table. It does NOT assert that another organization's
      #     published rows are invisible — the anonymous policy is `status = 'published'` and
      #     nothing else, deliberately, because this key ships in the client bundle and any
      #     organization scope it carried would be forgeable. docs/PLAN.md records that in
      #     full.
      #   - Row-level security, authenticated (added by #72): a signed-in member reads and
      #     writes its own organization's rows, drafts included, and is refused on every
      #     other organization's. This one *can* claim cross-tenant isolation, because the
      #     authenticated policies resolve the organization from the session rather than from
      #     anything the caller sends. It signs in for real, which is why the step below
      #     carries a secret and the two above it do not.
      #   - Message keys: every key the content queries return has copy in every catalogue.
      #     That join used to be checked by the compiler, when the keys were `as const`
      #     literal unions. It cannot be now, and a band with no message renders a blank card
      #     that reads like a CSS bug.
      #
      # Separate from test:unit so the fast gate stays hermetic — an unreachable project
      # should fail here, plainly, rather than making the pure-logic suite look broken.
      # Before the build, because either regression is worth failing on in seconds.
      #
      # SUPABASE_TEST_PASSWORD is a repository *secret*, unlike the two variables beside it.
      # It is the password of a real Supabase account, and the only credential in this
      # workflow that is not public by design — so it is masked, and it belongs to a member
      # of the fixture organization rather than of the live center. What it can reach if it
      # ever leaked is two rows whose text reads "FIXTURE — must never be visible".
      # supabase/fixtures/rls.sql explains why the account is scoped that way.
      - run: npm run test:db
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

      # Production build, not `next dev` — a change that only breaks when prerendered
      # should fail here rather than on the Netlify deploy.
      #
      # The Supabase variables are repository *variables*, not secrets: the anonymous key
      # and the project URL are public by design and ship in the client bundle, so masking
      # them in the log would buy nothing and make a failed build harder to read. Row-level
      # security is what protects the data. The service-role key is never used in CI.
      #
      # These are wired up before anything reads the database (issue #46), so the ticket
      # that adds the first query opens against a CI configuration that already works.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # End-to-end tests run against that production build (Playwright's webServer starts
      # `next start`), so the cold-load test exercises the same artefact Netlify publishes.
      # Only the browser the tests use is installed, to keep the job lean.
      - run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `next start`, which serves the prerendered pages built
      # above. The seven public pages should not touch the database at all; the variables are
      # passed anyway so that a page which unexpectedly renders on demand fails on its
      # assertion rather than on a missing-configuration error, which would point at CI
      # instead of at the page.
      #
      # From v0.4.0 the admin routes DO render on demand and DO reach Supabase — they verify
      # a session on every request. SUPABASE_TEST_PASSWORD is here for the same reason it is
      # on test:db above: tests/e2e/admin-auth.spec.ts signs in as a real account, because
      # "can a staff member actually get in and back out" is not answerable against a stub.
      # That half of the suite skips where the secret is absent (a working copy) and throws
      # where it must not be (CI) — the file says so at the top.
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

  # ---------------------------------------------------------------------------------------
  # Can the recovery scripts still be run?
  # ---------------------------------------------------------------------------------------
  #
  # `seed.sql` and `fixtures/rls.sql` are applied by hand, and until #93 they had been
  # unapplicable for several weeks with nothing reporting it: the twin-rows migration replaced
  # each unique constraint with two partial unique indexes, and `on conflict (cols)` could no
  # longer name one of them. Postgres refuses to plan such a statement, so the whole file
  # failed. The person most likely to discover that is someone restoring a broken database.
  #
  # #98 is this job. It is deliberately a SEPARATE job from `verify` above, for two reasons:
  # it needs a database of its own rather than the hosted project, and a red result here means
  # "the recovery path is broken", which is a different sentence from "the site is broken".
  #
  # THIS IS THE ONE PLACE THE PROJECT USES A LOCAL DATABASE, and it is not a reversal of the
  # constraint in supabase/migrations/README.md. That constraint is about the development
  # machine, which has no Docker; a GitHub runner has Docker already and charges nothing for
  # it on a public repository. Nothing here asks anyone to install anything locally.
  #
  # No credential of any kind: no service-role key, no project URL, no secret. The database is
  # created and destroyed inside this job. That is what makes the job cheap to reason about —
  # the worst it can do is fail.
  seed:
    name: Seed and fixtures can be re-applied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # For the Supabase CLI, which is a devDependency pinned exactly in package.json rather
      # than a separately versioned action — so the CLI that runs here is the CLI the lockfile
      # names, and it moves when the lockfile does.
      - run: npm ci

      # Pulls and starts Postgres, Auth and Storage; everything else is switched off in
      # supabase/config.toml. `start` applies the migrations and the seed on a fresh stack.
      - run: npx supabase start

      # Then does it again, deliberately and explicitly: `db reset` drops the database, replays
      # every migration in filename order, and applies seed.sql. That is the seed's FIRST
      # application, and the state the check below measures from.
      - run: npx supabase db reset

      # Does the database `db reset` just built actually hold a site? (#126)
      #
      # This runs BEFORE the re-apply check below, and the order is the point: it measures what
      # one clean pass of migrations-then-seed produces, which is exactly what a restore is.
      # Running it after the re-applications would measure a database that had been seeded three
      # times, and could pass on state the second and third passes put there.
      #
      # Until #126 this job proved the files could be RE-RUN and nothing proved the result was
      # usable. It was not: every prose migration is scoped `where o.slug = 'willow-grove'` and
      # `orgs` is empty while migrations run, so a fresh database came out with no copy at all.
      - name: A fresh database can render the site
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/checks/a-fresh-database-renders.sql

      # Applications two and three, plus the fixture applied twice, plus the assertions. The
      # script includes the committed files with `\ir` rather than a copy — a check that ran a
      # rewritten copy would be testing the rewrite.
      #
      # The connection string is the local stack's fixed one; the port is pinned in
      # supabase/config.toml. ON_ERROR_STOP so a 42P10 or a 23505 fails the job rather than
      # scrolling past as one red line among the notices.
      - name: Re-apply seed.sql and fixtures/rls.sql, and diff
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/checks/reseed-is-idempotent.sql
